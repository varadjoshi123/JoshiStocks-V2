services:
  - type: web
    name: joshistocks-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: JoshiStocks
      - key: FINNHUB_API_KEY
        sync: false
      - key: POLYGON_API_KEY
        sync: false
      - key: DEMO_STARTING_CASH
        value: "25000"
      - key: CORS_ORIGIN
        value: "*"
